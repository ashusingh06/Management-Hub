<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In with Google | [Management Hub]</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background-color: #fafafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #09090b;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .auth-container {
      background: #ffffff;
      border: 1px solid #e2e2e8;
      border-radius: 22px;
      padding: 40px 38px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.04);
      animation: modalSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
    }

    @keyframes modalSlide {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: #09090b;
      color: #ffffff;
      padding: 5px 14px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }

    .auth-header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #09090b;
      margin-bottom: 8px;
      line-height: 1.25;
    }

    .auth-header p {
      font-size: 14px;
      color: #71717a;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .btn-google-auth {
      width: 100%;
      padding: 14px 20px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      color: #09090b;
      background: #ffffff;
      border: 1.5px solid #e4e4e7;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .btn-google-auth:hover {
      background: #fafafc;
      border-color: #09090b;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      transform: translateY(-1px);
    }

    .btn-google-auth:active {
      transform: translateY(0);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .btn-google-auth:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .auth-perks {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid #f4f4f5;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .auth-perk-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #52525b;
      font-weight: 500;
    }

    .auth-perk-item svg {
      width: 16px;
      height: 16px;
      color: #166534;
      flex-shrink: 0;
    }

    .alert-box {
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.45;
      margin-bottom: 20px;
      display: none;
      text-align: left;
    }

    .alert-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .alert-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .alert-info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }

    .auth-footer {
      text-align: center;
      margin-top: 26px;
      padding-top: 18px;
      border-top: 1px solid #f4f4f5;
      font-size: 13px;
    }

    .auth-footer a {
      color: #71717a;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .auth-footer a:hover {
      color: #09090b;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-header">
      <div class="brand-pill">[Management Hub]</div>
      <h1 id="formHeading">Sign In with Google</h1>
      <p id="formSubheading">Access your IITM BS Management & Data Science study notes, past papers, and student tools.</p>
    </div>

    <!-- Notification Message Box -->
    <div class="alert-box alert-error" id="errorBox"></div>
    <div class="alert-box alert-success" id="successBox"></div>
    <div class="alert-box alert-info" id="infoBox"></div>

    <!-- 1-Click Google Sign In (Only Authentication Method) -->
    <button type="button" class="btn-google-auth" id="googleSignInBtn">
      <svg viewBox="0 0 24 24" style="width: 20px; height: 20px;">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <!-- Student Access Perks -->
    <div class="auth-perks">
      <div class="auth-perk-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>Instant 1-click access — no passwords needed</span>
      </div>
      <div class="auth-perk-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>View and download curated PDF Study Notes</span>
      </div>
      <div class="auth-perk-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        <span>Access Previous Year Question Papers (PYQs)</span>
      </div>
    </div>

    <div class="auth-footer">
      <a href="/index.html">← Return to Student Main Dashboard</a>
    </div>
  </div>

  <script>
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const infoBox = document.getElementById('infoBox');
    const googleSignInBtn = document.getElementById('googleSignInBtn');

    function showError(msg) {
      if (!errorBox) return;
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
      if (successBox) successBox.style.display = 'none';
      if (infoBox) infoBox.style.display = 'none';
    }

    function showSuccess(msg) {
      if (!successBox) return;
      successBox.textContent = msg;
      successBox.style.display = 'block';
      if (errorBox) errorBox.style.display = 'none';
      if (infoBox) infoBox.style.display = 'none';
    }

    function showInfo(msg) {
      if (!infoBox) return;
      infoBox.textContent = msg;
      infoBox.style.display = 'block';
      if (errorBox) errorBox.style.display = 'none';
      if (successBox) successBox.style.display = 'none';
    }

    // Check query params for redirect & reasons
    const urlParams = new URLSearchParams(window.location.search);
    const redirectParam = urlParams.get('redirect');
    const reasonParam = urlParams.get('reason');

    if (reasonParam === 'notes') {
      showInfo('🔒 Sign In Required: Please sign in with your Google account to view and download study notes and PYQs.');
    }

    // If user is already logged in, redirect them directly
    try {
      const existingUser = JSON.parse(localStorage.getItem('mghub_user') || 'null');
      if (existingUser && (existingUser.email || existingUser.uid)) {
        showSuccess(`You are already signed in as ${existingUser.name || existingUser.email}. Redirecting...`);
        setTimeout(() => {
          window.location.href = redirectParam || (existingUser.role === 'admin' ? '/inmycontrol' : '/index.html');
        }, 500);
      }
    } catch (e) {}

    if (googleSignInBtn) {
      googleSignInBtn.addEventListener('click', async () => {
        if (errorBox) errorBox.style.display = 'none';
        if (successBox) successBox.style.display = 'none';
        if (infoBox) infoBox.style.display = 'none';
        googleSignInBtn.disabled = true;
        googleSignInBtn.innerHTML = '<span>Connecting to Google...</span>';

        try {
          const user = await signInWithGoogle();
          showSuccess(`Welcome, ${user.name}! Redirecting...`);
          setTimeout(() => {
            const dest = redirectParam || (user.role === 'admin' ? '/inmycontrol' : '/index.html');
            window.location.href = dest;
          }, 600);
        } catch (err) {
          console.error(err);
          showError(err.message || 'Google sign in was cancelled or failed. Please try again.');
          googleSignInBtn.disabled = false;
          googleSignInBtn.innerHTML = `
            <svg viewBox="0 0 24 24" style="width: 20px; height: 20px;">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Continue with Google</span>
          `;
        }
      });
    }
  </script>
</body>
</html>
